version: '3.8'

services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: test_database
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - CHEF_PASSWORD=${CHEF_PASSWORD}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - EXPO_PUBLIC_BACKEND_URL=${EXPO_PUBLIC_BACKEND_URL}
      - EXPO_TUNNEL_SUBDOMAIN=${EXPO_TUNNEL_SUBDOMAIN}
    ports:
      - "8081:8082"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
